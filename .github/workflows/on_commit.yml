name: on_commit

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
      - uses: extractions/setup-just@v3

      - name: build
        run: just build

      - name: package amd64
        run: just package

      - name: package arm64
        run: just package arm64

      - name: release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: build/amd64.tar.gz build/arm64.tar.gz