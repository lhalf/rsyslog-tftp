name: on_commit

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: build
        run: ./dev/run_in_pod.sh "just build"

      - name: package
        run: ./dev/run_in_pod.sh "just package-all"

      - name: release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            build/*.deb
            build/*.rpm