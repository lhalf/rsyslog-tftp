name: on_commit

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
      - uses: extractions/setup-just@v3
      - uses: redhat-actions/podman-install@main

      - name: update submodules
        run: git submodule update --recursive

      - name: test
        run: just test
